name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint и типы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  unit:
    name: unit и веб (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:web

  integration:
    name: integration (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slotbook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slotbook_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://localhost:5432/slotbook_test
      TEST_DATABASE_USER: postgres
      TEST_DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: slotbook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d slotbook"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://localhost:5432/slotbook
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t slotbook:test .
      - name: поднять базу и приложение
        run: |
          docker network create slotbook-net
          docker run -d --name slotbook-db --network slotbook-net \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=slotbook \
            postgres:17-alpine
          for _ in $(seq 1 30); do
            docker exec slotbook-db pg_isready -U postgres -d slotbook && break
            sleep 1
          done
          docker run -d --name slotbook-app --network slotbook-net -p 3000:3000 \
            -e DATABASE_URL=postgres://slotbook-db:5432/slotbook \
            -e DATABASE_USER=postgres -e DATABASE_PASSWORD=postgres \
            slotbook:test
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
          curl -sf -o /dev/null -w "index: %{http_code}\n" http://localhost:3000/
      - name: логи контейнера
        if: always()
        run: docker logs slotbook-app --tail 40
      - name: убрать за собой
        if: always()
        run: |
          docker rm -f slotbook-app slotbook-db || true
          docker network rm slotbook-net || true
