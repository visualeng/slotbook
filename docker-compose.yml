# Локальный стенд целиком: база и приложение одним docker compose up.
# В проде так же: один контейнер отдаёт и API, и интерфейс.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slotbook
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slotbook"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://db:5432/slotbook
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      PORT: "3000"
    ports:
      - "3000:3000"

volumes:
  pgdata: